# Add these hooks to ~/.config/hypr/hypridle.conf so omavault locks instantaneously
# BEFORE the screen locks or laptop suspends (in addition to omavaultd's built-in
# hyprlock process monitor and CLOCK_BOOTTIME suspend detector).

general {
    lock_cmd = omavault lock; pidof hyprlock || hyprlock
    before_sleep_cmd = omavault lock; loginctl lock-session
}
