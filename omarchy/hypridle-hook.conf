# Add these hooks to ~/.config/hypr/hypridle.conf so omavault locks instantaneously
# BEFORE the screen locks or laptop suspends (in addition to omavaultd's built-in
# /proc/<pid>/status hyprlock monitor and CLOCK_BOOTTIME suspend detector).
#
# Resolves the root-owned packaged /usr/bin/omavault first (falling back to ~/.local/bin only when
# no package is installed, same as omavault.lua) and uses a strict 2-second timeout so screen
# locking can never be delayed. If the daemon socket is busy, `omavault lock` falls back to
# signalling the daemon directly. omavaultd ALSO holds its own logind pre-sleep inhibitor, so
# before_sleep_cmd is defence in depth, not the only pre-sleep lock.

general {
    lock_cmd = sh -c 'b=/usr/bin/omavault; [ -x "$b" ] || b="$HOME/.local/bin/omavault"; timeout 2 "$b" lock' || true; pidof hyprlock || hyprlock
    before_sleep_cmd = sh -c 'b=/usr/bin/omavault; [ -x "$b" ] || b="$HOME/.local/bin/omavault"; timeout 2 "$b" lock' || true; loginctl lock-session
}
