# Add these hooks to ~/.config/hypr/hypridle.conf so omavault locks instantaneously
# BEFORE the screen locks or laptop suspends (in addition to omavaultd's built-in
# /proc/<pid>/status hyprlock monitor and CLOCK_BOOTTIME suspend detector).
#
# Uses an explicit $HOME/.local/bin/omavault path and a strict 2-second timeout so
# screen locking can never be delayed if the daemon is busy.

general {
    lock_cmd = timeout 2 "$HOME/.local/bin/omavault" lock || true; pidof hyprlock || hyprlock
    before_sleep_cmd = timeout 2 "$HOME/.local/bin/omavault" lock || true; loginctl lock-session
}
