# Omarchy / Hyprland integration for omavault
# Source this file from ~/.config/hypr/hyprland.conf or ~/.config/hypr/bindings.conf:
#   source = ~/.config/hypr/omavault.conf

# Floating centered window rules for the omavault TUI terminal (Hyprland 0.53+ syntax)
windowrule = float on, match:class ^(omavault-tui)$
windowrule = size 1080 680, match:class ^(omavault-tui)$
windowrule = center on, match:class ^(omavault-tui)$
windowrule = stay_focused on, match:class ^(omavault-tui)$
# Prevent screenshots / screen-sharing portals from capturing the password manager window!
windowrule = no_screen_share on, match:class ^(omavault-tui)$

# If running Hyprland <= 0.52, replace the 5 lines above with:
# windowrulev2 = float, class:^(omavault-tui)$
# windowrulev2 = size 1080 680, class:^(omavault-tui)$
# windowrulev2 = center, class:^(omavault-tui)$
# windowrulev2 = stayfocused, class:^(omavault-tui)$
# windowrulev2 = noscreenshare, class:^(omavault-tui)$

# Launch omavault TUI in Omarchy's default terminal with scrollback disabled (`scrolling.history=0`)
# Super + Shift + P opens your hardened password vault anywhere
bindd = SUPER SHIFT, P, Password Vault (omavault), exec, alacritty --class omavault-tui --title "omavault" -o scrolling.history=0 -e "$HOME/.local/bin/omavault" tui

# Super + Ctrl + Shift + L immediately locks omavault & wipes RAM/clipboard
bindd = SUPER CTRL SHIFT, L, Lock omavault immediately, exec, "$HOME/.local/bin/omavault" lock
